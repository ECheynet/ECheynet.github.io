name: Integration tests

on:
  push:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
      - ".github/scripts/**"
  pull_request:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  site-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Run style contract lint 🧷
        run: npm run lint:style-contract

      - name: Test CI mirror configuration
        run: python -m unittest discover -s test -p test_ci_apt.py

      - name: Install build prerequisites 🔧
        timeout-minutes: 6
        run: |
          sudo bash .github/scripts/configure-apt-mirrors.sh
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo timeout 120s apt-get "${apt_options[@]}" update
          sudo timeout 180s apt-get "${apt_options[@]}" install -y --no-install-recommends imagemagick
          python -m pip install --upgrade --retries 2 --timeout 15 nbconvert

      - name: Check formatting
        run: npm run lint:prettier

      - name: Build the academic site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Validate rendered pages, internal links and features
        run: python test/check_academic_site.py _site

      - name: Check al-folio upgrade compatibility
        run: bundle exec al-folio upgrade audit
